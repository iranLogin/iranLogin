name: Build iranLogin

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: temurin
      cache: maven

  - name: Build plugin
    run: mvn -B package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: iranLogin
      path: target/*.jar
